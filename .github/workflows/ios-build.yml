name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the App ID registered in the Apple Developer portal and the provisioning profile.
  BUNDLE_ID: com.tasktracker.app.TaskTracker
  # ad-hoc (registered test devices) | app-store-connect (TestFlight) | development
  EXPORT_METHOD: ad-hoc

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Detect signing secrets
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          # P12_PASSWORD is optional (an empty password is valid). Without the cert + profile
          # we fall back to an UNSIGNED build so the workflow still succeeds.
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::BUILD_CERTIFICATE_BASE64 / PROVISION_PROFILE_BASE64 not set - building an UNSIGNED .ipa (not installable without re-signing)"
          fi

      - name: Install certificate and provisioning profile
        if: env.SIGNING == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # Falls back to a random password if KEYCHAIN_PASSWORD isn't set (it only protects this temp keychain).
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"

          for name in BUILD_CERTIFICATE_BASE64 PROVISION_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing"
              exit 1
            fi
          done

          # tr strips any newlines/spaces pasted into the secret
          echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d ' \n\r' | base64 --decode > "$CERT_PATH"
          echo -n "$PROVISION_PROFILE_BASE64" | tr -d ' \n\r' | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if ! security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"; then
            # .p12 files made with OpenSSL 3 use encryption macOS can't read; repack in the legacy format.
            echo "security import failed, retrying with a legacy-format .p12"
            OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
            if ! "$OPENSSL" pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/all.pem"; then
              echo "::error::Cannot open the .p12 - P12_PASSWORD is wrong or BUILD_CERTIFICATE_BASE64 is not a valid .p12"
              exit 1
            fi
            "$OPENSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP/all.pem" -out "$RUNNER_TEMP/legacy.p12" -passout env:P12_PASSWORD
            rm -f "$RUNNER_TEMP/all.pem"
            security import "$RUNNER_TEMP/legacy.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build and archive
        if: env.SIGNING == 'true'
        working-directory: iosApp
        run: |
          set -euo pipefail
          # Build number increases on every run so each upload is unique (required by TestFlight).
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaskTracker.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Build unsigned .ipa (fallback)
        if: env.SIGNING != 'true'
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TaskTracker.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          cd "$GITHUB_WORKSPACE"
          mkdir -p build-output "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/TaskTracker.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/build-output/TaskTracker.ipa" Payload)

      - name: Export .ipa
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TaskTracker.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p build-output
          cp "$RUNNER_TEMP"/export/*.ipa build-output/TaskTracker.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskTracker-ipa
          path: build-output/TaskTracker.ipa
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-build-${{ github.run_number }}" build-output/TaskTracker.ipa \
            --title "iOS build #${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }} (${{ env.EXPORT_METHOD }})" \
            --prerelease

      - name: Upload to TestFlight
        if: env.SIGNING == 'true' && env.EXPORT_METHOD == 'app-store-connect'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f build-output/TaskTracker.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain and profile
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
